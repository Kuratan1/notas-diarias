name: Postar nota

on:
  schedule:
    # A cada 10 min (horário UTC). O GitHub pode atrasar alguns minutos; a hora na arte
    # é gerada no momento da publicação, então continua batendo com o post.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Só gerar a arte, sem publicar"
        type: boolean
        default: true
      id:
        description: "id do post na agenda (vazio = o vencido mais antigo)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: postar
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Sao_Paulo
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      ARROBA: ${{ vars.ARROBA }}
      JANELA_MIN: ${{ vars.JANELA_MIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Tem post para sair?
        id: verificar
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "vencido=sim" >> "$GITHUB_OUTPUT"
          else
            python3 postar.py --verificar
          fi

      - if: steps.verificar.outputs.vencido == 'sim'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.verificar.outputs.vencido == 'sim'
        run: npm install --no-audit --no-fund

      - if: steps.verificar.outputs.vencido == 'sim'
        name: Gerar e publicar
        run: |
          git config user.name "notas-bot"
          git config user.email "notas-bot@users.noreply.github.com"
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.simular }}" = "true" ] && ARGS="$ARGS --simular"
            [ -n "${{ inputs.id }}" ] && ARGS="$ARGS --id ${{ inputs.id }}"
          fi
          python3 postar.py $ARGS

      - if: always() && steps.verificar.outputs.vencido == 'sim'
        uses: actions/upload-artifact@v4
        with:
          name: arte
          path: arte/*.jpg
          if-no-files-found: ignore
          retention-days: 7
